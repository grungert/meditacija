<meta charset="utf-8">
<title>Nebo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed live sky with a breathing circle of light in the upper third, a swaying meadow below,
   and quiet glass controls at the edges that fade when idle.
   Deliberately single-look: the sky is the world, so colours are set explicitly rather than following light/dark. */
:root {
  --ink: #ffffff;
  --ink-soft: rgba(255, 255, 255, 0.80);
  --glass: rgba(255, 255, 255, 0.14);
  --glass-strong: rgba(255, 255, 255, 0.32);
  --glass-line: rgba(255, 255, 255, 0.40);
  --menu-bg: rgba(20, 34, 70, 0.42);
  --shade: rgba(16, 32, 72, 0.45);
  --sky-fallback: #5aa6e6;
  --font-word: "Shippori Mincho", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-ui: "Zen Maru Gothic", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--sky-fallback);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { pointer-events: none; }

.stage {
  position: fixed; inset: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
  text-shadow: 0 1px 14px var(--shade);
}

.ui { transition: opacity 0.9s ease; }
body.idle .ui { opacity: 0; pointer-events: none; }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.mark { font-family: var(--font-word); font-weight: 600; font-size: 1.15rem; letter-spacing: 0.06em; padding-top: 4px; }

.pill, .chip, .play, .opt {
  font: inherit;
  color: var(--ink);
  background: var(--glass);
  border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  cursor: pointer;
  text-shadow: inherit;
}
.pill { font-size: 0.85rem; padding: 6px 12px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: baseline; }
.pill .sub { color: var(--ink-soft); font-size: 0.78rem; }
.chip[aria-checked="true"], .opt[aria-checked="true"] { background: var(--glass-strong); border-color: var(--ink); }
.pill:focus-visible, .chip:focus-visible, .play:focus-visible, .opt:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.timewrap { position: relative; display: grid; justify-items: end; }
.menu {
  position: absolute; top: calc(100% + 8px); right: 0;
  width: min(300px, calc(100vw - 32px));
  display: grid; gap: 10px;
  padding: 12px;
  border-radius: 16px;
  background: var(--menu-bg);
  border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
.menu-label { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.menu-row { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { font-size: 0.85rem; padding: 6px 11px; border-radius: 10px; }

.breath {
  position: absolute; left: 50%; top: 36%;
  transform: translate(-50%, -50%);
  display: grid; justify-items: center; gap: 6px;
  pointer-events: none;
  text-align: center;
}
.word {
  margin: 0;
  font-family: var(--font-word);
  font-weight: 500;
  font-size: clamp(1.7rem, 6.4vw, 2.5rem);
  letter-spacing: 0.04em;
  line-height: 1;
  text-shadow: 0 1px 3px rgba(16, 32, 72, 0.35), 0 2px 22px rgba(16, 32, 72, 0.55);
}
.count { margin: 0; font-size: 0.9rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }

.top { grid-row: 1; }
.bottom { grid-row: 3; align-self: end; display: grid; gap: 14px; justify-items: center; }
.patterns { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { display: grid; gap: 1px; justify-items: center; min-width: 76px; padding: 8px 12px; border-radius: 14px; }
.chip b { font-weight: 500; font-size: 0.98rem; font-variant-numeric: tabular-nums; }
.chip small { font-size: 0.72rem; color: var(--ink-soft); letter-spacing: 0.03em; }
.row { display: flex; align-items: center; gap: 14px; }
.play { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; }
.play svg { width: 20px; height: 20px; fill: var(--ink); filter: drop-shadow(0 1px 6px var(--shade)); }
.stats { font-size: 0.82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 9.5em; }

.nogl-msg { display: none; }
body.nogl .nogl-msg { display: block; position: fixed; left: 16px; right: 16px; bottom: 40%; text-align: center; }
body.nogl { background: linear-gradient(#2f72c9, #9fd3f0); }

@media (prefers-reduced-motion: reduce) { .ui { transition: none; } }
</style>

      </button>
      <span class="stats" id="stats">0:00 · 1 udah</span>
    </div>
  </footer>
</main>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform float uDrift;     // integrated wind (slows during holds)
uniform float uMorph;     // integrated shape evolution
uniform float uWind;      // integrated gust phase, shared with the grass blades
uniform float uBreath;    // 0 = empty lungs, 1 = full
uniform float uMotion;    // 1 normal, ~0.3 reduced motion
uniform vec3 uSkyTop, uSkyMid, uSkyHor;
uniform vec3 uSh, uMd, uLt, uRim;
uniform vec3 uSunCol, uGrassTop, uGrassBot;
uniform vec2 uSunPos, uMoonPos;   // in uv space
uniform float uSunAmt, uMoonAmt, uStars;
uniform vec3 uLight;              // normalised direction towards the sun or moon

float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = m * p + vec2(3.1, 1.7);
    a *= 0.5;
  }
  return v;
}

float smax(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (a - b) / k, 0.0, 1.0);
  return mix(b, a, h) + k * h * (1.0 - h);
}

// Union of round puffs on a jittered grid: the hand-drawn "cauliflower" lobes.
// x: field (> 0 inside a puff, cell units). y: sphere shading towards the light (-1..1).
vec2 puffs(vec2 q, float seed) {
  vec2 i = floor(q);
  vec2 f = fract(q);
  float field = -1.0;
  float wSum = 0.0;
  float sSum = 0.0;
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 g = vec2(float(x), float(y));
      vec2 id = i + g;
      vec2 o = vec2(hash(id + seed), hash(id + seed + 17.0));
      float r = 0.42 + 0.46 * hash(id + seed + 31.0);
      vec2 off = f - g - o;
      float dd = r - length(off);
      field = smax(field, dd, 0.12);
      // puffs that bulge further towards the viewer dominate the shading; soft weights avoid shard-like seams
      float bulge = dd / r;
      vec2 n2 = off / r;
      vec3 n = vec3(n2, sqrt(max(0.0, 1.0 - dot(n2, n2))));
      float w = exp(14.0 * bulge);
      wSum += w;
      sSum += w * dot(n, uLight);
    }
  }
  return vec2(field, sSum / max(wSum, 1e-4));
}

// Signed density of one cumulus layer: > 0 inside the cloud.
// An envelope gives towers with a flat base; puffs give the rounded lobes and their light;
// smaller puffs add lobes on the lobes. Puffs drift upward slowly (convection).
float cloud(vec2 p, float base, float height, float scale, float seed, float cover, out float mass, out float shade) {
  float x = p.x * scale + seed * 13.7;
  mass = noise(vec2(x * 0.9, seed)) * 0.65 + noise(vec2(x * 2.1, seed + 5.3)) * 0.35;
  mass = smoothstep(0.40 - cover, 0.78 - cover * 0.5, mass);
  float top = base + height * mass;
  float env = (top - p.y) / height;
  vec2 q = vec2(p.x * scale * 3.2 + uMorph * 0.25, (p.y - base) * scale * 3.2 - uMorph * 0.4) + seed * 11.0;
  vec2 big = puffs(q, seed);
  vec2 small = puffs(q * 2.3 + 5.0, seed + 3.0);
  float d = env * 1.2 + big.x * 0.9 - 0.25 + small.x * 0.30 + (fbm(q * 4.0) - 0.5) * 0.08;
  shade = mix(big.y, small.y, 0.22 * smoothstep(-0.05, 0.1, small.x));
  float wob = (noise(vec2(p.x * scale * 5.0 + seed, seed)) - 0.5) * 0.022
            + (noise(vec2(p.x * scale * 19.0 + seed, seed + 2.0)) - 0.5) * 0.008;
  float bottom = (p.y - base + wob) / height * 9.0;
  return min(d, bottom);
}

// Painterly three-tone shading with a warm rim on the lit side.
vec4 layer(vec2 p, float base, float height, float scale, float seed, float cover, float edge, float haze, vec3 skyC) {
  if (p.y < base - 0.03 || p.y > base + height * 1.6 + 0.08) return vec4(0.0);
  float mass;
  float shade;
  float d = cloud(p, base, height, scale, seed, cover, mass, shade);
  if (d < -0.02) return vec4(0.0);

  float vf = clamp((p.y - base) / (height * max(mass, 0.25)), 0.0, 1.0);
  float l = clamp(0.02 + 0.30 * vf + 0.62 * (shade * 0.5 + 0.5) + (uBreath - 0.4) * 0.18, 0.0, 1.0);

  vec3 col = mix(uSh, uMd, smoothstep(0.40, 0.43, l));
  col = mix(col, uLt, smoothstep(0.64, 0.67, l));
  col *= 0.95 + 0.07 * l;

  float rimMask = (1.0 - smoothstep(0.0, edge * 4.0, d)) * smoothstep(0.1, 0.5, shade);
  col = mix(col, uRim, rimMask * (0.7 + 0.3 * uBreath));

  float baseShade = 1.0 - smoothstep(0.04, 0.16, (p.y - base) / height);
  col = mix(col, uSh * 0.97, baseShade * 0.55);

  col = mix(col, skyC, haze);
  return vec4(col, smoothstep(0.0, edge, d));
}

vec3 skyColor(float y) {
  vec3 c = mix(uSkyHor, uSkyMid, smoothstep(0.0, 0.45, y));
  return mix(c, uSkyTop, smoothstep(0.40, 1.0, y));
}

float hill(float x) {
  return 0.115 + 0.03 * sin(x * 1.6 + 0.8) + 0.018 * sin(x * 3.7 + 2.0);
}

// Gust strength along the meadow; the same formula bends the blades drawn on top.
float gust(float x) {
  float g = 0.5 + 0.5 * sin(x * 3.0 + uWind + 0.6 * sin(x * 1.3 - uWind * 0.3));
  return g * g;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float asp = uRes.x / uRes.y;
  vec2 p = vec2(uv.x * asp, uv.y);
  vec2 sunP = vec2(uSunPos.x * asp, uSunPos.y);
  vec2 moonP = vec2(uMoonPos.x * asp, uMoonPos.y);
  float b = uBreath;

  vec3 skyC = skyColor(uv.y);
  vec3 col = skyC;

  // stars, behind everything
  if (uStars > 0.01) {
    vec2 sg = p * 90.0;
    vec2 id = floor(sg);
    float h = hash(id);
    if (h > 0.972) {
      float k = (h - 0.972) / 0.028;
      vec2 sp = id + vec2(hash(id + 3.1), hash(id + 7.7));
      float tw = 0.55 + 0.45 * sin(uTime * (0.8 + k * 2.5) + h * 40.0);
      float s = smoothstep(0.10 + 0.16 * k, 0.0, length(sg - sp)) * tw * smoothstep(0.12, 0.45, uv.y);
      col += vec3(0.86, 0.90, 1.0) * s * uStars * (0.35 + 0.65 * k) * 1.6;
    }
    // faint milky band
    float band = exp(-pow((p.y - 0.55 - (p.x - asp * 0.5) * 0.35) * 5.0, 2.0));
    col += vec3(0.30, 0.34, 0.50) * band * fbm(p * 6.0) * 0.18 * uStars;
  }

  // moon
  vec2 dvm = p - moonP;
  float dm = length(dvm);
  if (uMoonAmt > 0.01) {
    float disc = smoothstep(0.036, 0.033, dm);
    float lit = smoothstep(0.030, 0.037, length(dvm - vec2(0.014, 0.008)));
    vec3 moonCol = vec3(0.98, 0.96, 0.88) * mix(0.30, 1.0, lit) * (0.92 + 0.08 * noise(p * 140.0));
    col = mix(col, moonCol, disc * uMoonAmt);
    col += vec3(0.55, 0.65, 0.90) * (exp(-dm * 8.0) * 0.22 + exp(-dm * 30.0) * 0.20) * uMoonAmt;
  }

  // sun disc and rays
  vec2 dv = p - sunP;
  float dist = length(dv);
  if (uSunAmt > 0.01) {
    col = mix(col, uSunCol * 0.4 + vec3(0.65), smoothstep(0.032, 0.026, dist) * uSunAmt);
    float ang = atan(dv.y, dv.x);
    float rays = noise(vec2(ang * 5.0, uTime * 0.03)) * noise(vec2(ang * 11.0, 2.0 + uTime * 0.02));
    col += uSunCol * rays * exp(-dist * 1.8) * (0.05 + 0.13 * b) * uSunAmt;
  }

  vec2 c = vec2(asp * 0.5, 0.42);
  vec2 pc = c + (p - c) / (1.0 + 0.035 * b * uMotion);

  // high cirrus streaks
  float band = smoothstep(0.62, 0.76, pc.y) * (1.0 - smoothstep(0.86, 0.98, pc.y));
  if (band > 0.0) {
    float ci = fbm(vec2(pc.x * 1.4 + uDrift * 0.15 + pc.y * 0.8, pc.y * 16.0));
    col = mix(col, mix(uMd, uLt, 0.6), smoothstep(0.56, 0.74, ci) * band * 0.40);
  }

  vec4 L1 = layer(pc + vec2(uDrift * 0.35, 0.0), 0.36, 0.14, 3.0, 1.0, 0.06, 0.030, 0.42, skyC);
  col = mix(col, L1.rgb, L1.a);
  vec4 L2 = layer(pc + vec2(uDrift * 0.60, 0.0), 0.25, 0.28, 1.9, 2.0, 0.08, 0.018, 0.16, skyC);
  col = mix(col, L2.rgb, L2.a);
  vec4 L3 = layer(pc + vec2(uDrift, 0.0), 0.11, 0.50, 1.2, 3.0, 0.10, 0.012, 0.0, skyC);
  col = mix(col, L3.rgb, L3.a);

  // meadow: painted mass with rolling gust highlights; blades are drawn on top
  float hl = hill(p.x) + (noise(vec2(p.x * 60.0, 1.0)) - 0.5) * 0.006;
  float inG = 1.0 - smoothstep(hl - 0.002, hl + 0.002, p.y);
  if (inG > 0.0) {
    float depth = clamp((hl - p.y) / 0.15, 0.0, 1.0);
    vec3 g = mix(uGrassTop, uGrassBot, depth);
    float w = gust(p.x + (hl - p.y) * 0.8);
    g += uSunCol * 0.13 * smoothstep(0.35, 0.95, w) * (1.0 - depth * 0.6) * (0.25 + 0.75 * uSunAmt);
    g *= 0.94 + 0.08 * noise(vec2(p.x * 220.0, p.y * 18.0));
    col = mix(col, g, inG);
  }

  float glow = exp(-dist * 2.6) * 0.35 + exp(-dist * 9.0) * 0.45;
  col += uSunCol * glow * (0.50 + 0.80 * b) * uSunAmt;

  col *= 1.0 - (0.10 + 0.14 * uStars) * pow(length(uv - 0.5) * 1.2, 2.0);
  col += (hash(gl_FragCoord.xy + fract(uTime) * 100.0) - 0.5) * 0.012;
  gl_FragColor = vec4(col, 1.0);
}
</script>

  // ---------- time-of-day menu ----------

  timeMenu.addEventListener("click", (e) => {

  }
  syncTimeUi();

  function stepTime(dt) {
    if (timeMode === "cycle") { tod = (tod + dt * 24 / CYCLE_SECONDS) % 24; }

    $("timeSub").textContent = timeMode === "clock" ? "po satu" : timeMode === "cycle" ? "ciklus" : "";
  }

  let lastPoke = performance.now();

  function announce() {
    const [type] = pattern.phases[phaseIdx];

  const ease = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(x));
  let progress = 0;
  function stepBreath(dt) {
    if (running) {

  function resetLeaf(l) {

    const amp = (0.18 + 0.42 * wind) * (reduced ? 0.4 : 1);
    const night = pal.stars;

      const tx = s.x + Math.sin(ang) * s.h, ty = s.y - Math.cos(ang) * s.h;

      for (let k = 0; k < 5; k++) {

  }

  function drawLeaves(pal, dt, t) {
    const amt = (1 - pal.stars) * (reduced ? 0 : 1);

  function drawFireflies(pal, t) {
    const amt = pal.stars;
    if (amt < 0.05) return;

      const x = (f.x * W + Math.sin(t * f.sp * 0.5 + f.ph) * 40 * DPR + t * 6 * DPR * f.sp) % (W + 60 * DPR) - 30 * DPR;

  function drawCircle(pal, t, dt) {
    const cx = W / 2, cy = H * 0.36;

    g.addColorStop(0.55, css(warm, 0.05 * dim));
    g.addColorStop(0.92, css(warm, 0.10 * dim));

    ctx.save();

    ctx.shadowBlur = 10 * DPR;
    ctx.strokeStyle = css([1, 1, 1], 0.6);

      m.a += m.spd * dt * (0.35 + 0.65 * wind) * (reduced ? 0.3 : 1);
      const spread = (1 - breath) * 0.6 * m.loose;
      const rr = r * (1 + m.off * 0.05 + spread + 0.015 * Math.sin(t * 1.3 + m.tw));
      const x = cx + Math.cos(m.a) * rr, y = cy + Math.sin(m.a) * rr;
      const tw = 0.5 + 0.5 * Math.sin(t * 2.1 + m.tw);
      const s = (7 + 9 * m.s) * DPR * (0.8 + 0.4 * breath);
      ctx.globalAlpha = (0.25 + 0.75 * tw) * (1 - spread * 0.8) * (0.6 + 0.4 * breath);
      ctx.drawImage(moteSprite, x - s / 2, y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function drawOverlay(pal, t, dt) {
    ctx.clearRect(0, 0, W, H);
    drawLeaves(pal, dt, t);
    drawMeadow(pal, t);
    drawFireflies(pal, t);
    drawCircle(pal, t, dt);
  }

  // ---------- WebGL sky ----------
  const canvas = $("sky");
  const gl = canvas.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" });
  let glOk = !!gl, U = {}, scale = 0.7;

  if (glOk) {
    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
      return s;
    };
    const vs = compile(gl.VERTEX_SHADER, "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}");
    const fs = compile(gl.FRAGMENT_SHADER, $("frag").textContent);
    const prog = vs && fs ? gl.createProgram() : null;
    if (prog) {
      gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); glOk = false; }
    } else glOk = false;
    if (glOk) {
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "a");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      for (const n of ["uRes", "uTime", "uDrift", "uMorph", "uWind", "uBreath", "uMotion", "uSkyTop", "uSkyMid", "uSkyHor",
        "uSh", "uMd", "uLt", "uRim", "uSunCol", "uGrassTop", "uGrassBot", "uSunPos", "uMoonPos", "uSunAmt", "uMoonAmt", "uStars", "uLight"]) {
        U[n] = gl.getUniformLocation(prog, n);
      }
    }
  }
  if (!glOk) document.body.classList.add("nogl");

  // Adaptive resolution: clouds are soft, so rendering below native size is invisible but saves the battery.
  function resize() {
    if (glOk) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(canvas.clientWidth * dpr * scale));
      const h = Math.max(1, Math.round(canvas.clientHeight * dpr * scale));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
    }
    resizeFx();
  }
  addEventListener("resize", resize);
  resize();

  function lightDir(pos) { return [(pos[0] - 0.5) * 1.4, Math.max(-0.3, pos[1] - 0.3) + 0.15, 0.35]; }
  const norm = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return v.map((x) => x / l); };

  let last = performance.now(), frames = 0, acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now; clock += dt;
    stepBreath(dt);
    stepTime(dt);

    const pal = paletteAt(tod);
    const sp = sunPos(tod), mp = moonPos(tod);
    const sunAmt = sstep(5.5, 6.6, tod) * (1 - sstep(19.3, 20.2, tod));
    const moonAmt = clamp01(1 - sstep(5.2, 6.3, tod) + sstep(19.6, 20.8, tod));
    const L = norm(mixArr(lightDir(mp), lightDir(sp), sunAmt > 0.001 ? clamp01(sunAmt * 1.5) : 0));

    if (glOk) {
      acc += dt; frames++;
      if (frames === 45) {
        const avg = acc / frames;
        if (avg > 0.024 && scale > 0.5) { scale = Math.max(0.5, scale * 0.85); resize(); }
        else if (avg < 0.0145 && scale < 0.95) { scale = Math.min(0.95, scale * 1.08); resize(); }
        frames = 0; acc = 0;
      }
      gl.uniform2f(U.uRes, canvas.width, canvas.height);
      gl.uniform1f(U.uTime, clock);
      gl.uniform1f(U.uDrift, drift);
      gl.uniform1f(U.uMorph, morph);
      gl.uniform1f(U.uWind, windPhase);
      gl.uniform1f(U.uBreath, breath);
      gl.uniform1f(U.uMotion, reduced ? 0.3 : 1);
      gl.uniform3fv(U.uSkyTop, pal.skyTop); gl.uniform3fv(U.uSkyMid, pal.skyMid); gl.uniform3fv(U.uSkyHor, pal.skyHor);
      gl.uniform3fv(U.uSh, pal.sh); gl.uniform3fv(U.uMd, pal.md); gl.uniform3fv(U.uLt, pal.lt); gl.uniform3fv(U.uRim, pal.rim);
      gl.uniform3fv(U.uSunCol, pal.sun); gl.uniform3fv(U.uGrassTop, pal.gTop); gl.uniform3fv(U.uGrassBot, pal.gBot);
      gl.uniform2fv(U.uSunPos, sp); gl.uniform2fv(U.uMoonPos, mp);
      gl.uniform1f(U.uSunAmt, sunAmt); gl.uniform1f(U.uMoonAmt, moonAmt); gl.uniform1f(U.uStars, pal.stars);
      gl.uniform3fv(U.uLight, L);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    drawOverlay(pal, clock, dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
